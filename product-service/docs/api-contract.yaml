openapi: 3.0.3
info:
  title: Product Service API
  description: >
    API del catálogo de categorías, productos base localizados y productos de
    usuario monolingües para ShoppingList. Los productos base y de usuario se
    exponen como colecciones independientes y sus DTOs reflejan sus reglas de
    ciclo de vida, internacionalización y propiedad.


    Nota de vigencia: este documento es el contrato de diseño de Fase 1,
    redactado antes de implementar el servicio. Una vez exista código y
    springdoc-openapi genere el contrato real a partir de él, este fichero se
    marcará como snapshot histórico de diseño (no se mantendrá sincronizado a
    mano), y el contrato vigente pasará a ser el expuesto en /v3/api-docs.
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: Entorno local (Docker Compose)

tags:
  - name: categories
    description: Catálogo de categorías, gestionado por el sistema.
  - name: base-products
    description: Catálogo de productos base, gestionado por administradores.
  - name: user-products
    description: "Productos de usuario: catálogo personal creado por cada usuario."

paths:
  /categories:
    get:
      tags: [categories]
      summary: Listar categorías del catálogo
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de categorías, traducidas al idioma solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
    post:
      tags: [categories]
      summary: Crear una categoría del catálogo con sus traducciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Categoría creada.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Ya existe una categoría con ese code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/{id}:
    get:
      tags: [categories]
      summary: Obtener una categoría por id
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Categoría encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'

  /base-products:
    get:
      tags: [base-products]
      summary: Listar productos base
      description: >
        Listado público del catálogo de productos base. Devuelve nombre y
        descripción localizados según `Accept-Language` con el fallback de
        ADR-011.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
            nullable: true
        - name: text
          in: query
          description: Búsqueda textual en el nombre localizado.
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: Página de productos base con nombre y descripción localizados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseProductPage'
    post:
      tags: [base-products]
      summary: Crear un producto base
      description: >
        Operación administrativa. Mismo criterio placeholder que ADR-006 para
        propietario: sin auth real hasta Fase 4
        (ADR-XXF4-keycloak-como-identity-provider pendiente).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBaseProductRequest'
      responses:
        '201':
          description: Producto base creado.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseProduct'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Ya existe un producto base con ese code.

  /base-products/{id}:
    get:
      tags: [base-products]
      summary: Obtener un producto base por id
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Producto base encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseProduct'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [base-products]
      summary: Editar un producto base
      description: >
        Operación administrativa. Mismo criterio placeholder que ADR-006 para
        propietario: sin auth real hasta Fase 4
        (ADR-XXF4-keycloak-como-identity-provider pendiente).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBaseProductRequest'
      responses:
        '200':
          description: Producto base actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseProduct'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya existe otro producto base con ese code.
    delete:
      tags: [base-products]
      summary: Eliminar un producto base
      description: >
        Operación administrativa. Mismo criterio placeholder que ADR-006 para
        propietario: sin auth real hasta Fase 4
        (ADR-XXF4-keycloak-como-identity-provider pendiente).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Producto base eliminado.
        '404':
          $ref: '#/components/responses/NotFound'

  /user-products:
    get:
      tags: [user-products]
      summary: Listar productos de un propietario
      description: >
        Placeholder de ADR-006: se listan los productos del `ownerId` indicado
        sin enforcement de identidad real hasta Fase 4.
      parameters:
        - name: ownerId
          in: query
          required: true
          description: >
            UUID del propietario. Placeholder sin autenticación real (ver
            ADR-006-identificacion-propietario-sin-autenticacion).
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
            nullable: true
      responses:
        '200':
          description: Página de productos de usuario del propietario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProductPage'
    post:
      tags: [user-products]
      summary: Crear un producto de usuario
      description: >
        Crea un producto de usuario. Si se especifica `basedOnBaseId`, el
        servicio copia los valores del producto base origen (snapshot en el
        locale del `Accept-Language` de la petición), permitiendo sobreescribir
        los campos en el body. `basedOnBaseId` queda como trazabilidad histórica
        inmutable.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserProductRequest'
      responses:
        '201':
          description: Producto de usuario creado.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProduct'
        '400':
          $ref: '#/components/responses/ValidationError'

  /user-products/{id}:
    get:
      tags: [user-products]
      summary: Obtener un producto de usuario por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Producto de usuario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProduct'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [user-products]
      summary: Editar un producto de usuario
      description: Solo el propietario puede editarlo; enforcement real pendiente de ADR-006.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProductRequest'
      responses:
        '200':
          description: Producto de usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProduct'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No se puede modificar un campo inmutable como basedOnBaseId.
    delete:
      tags: [user-products]
      summary: Eliminar un producto de usuario
      description: Solo el propietario puede eliminarlo; enforcement real pendiente de ADR-006.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Producto de usuario eliminado.
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >
        Idioma solicitado para entidades del catálogo (es | en | eu). Si no se
        especifica o el idioma no tiene traducción, se aplica fallback a `en`.
      schema:
        type: string
        enum: [es, en, eu]
        default: en
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Error de validación en la petición.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          example: dairy
        name:
          type: string
          description: Traducción en el idioma resuelto (Accept-Language, con fallback a en).
        isActive:
          type: boolean

    CategoryPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64

    CreateCategoryRequest:
      type: object
      required: [code, isActive, translations]
      properties:
        code:
          type: string
          minLength: 1
          example: dairy
        isActive:
          type: boolean
        translations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Translation'

    Translation:
      type: object
      required: [locale, name]
      properties:
        locale:
          type: string
          minLength: 2
          maxLength: 5
          example: es
        name:
          type: string
          maxLength: 128
          example: Lácteos

    BaseProduct:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        categoryId:
          type: integer
          format: int64
        defaultUnit:
          $ref: '#/components/schemas/UnitEnum'
        calories:
          type: integer
          format: int32
          nullable: true
        caloriesPer:
          $ref: '#/components/schemas/CaloriesPerEnum'
        isActive:
          type: boolean
        name:
          type: string
          description: Nombre resuelto mediante i18n y fallback.
        description:
          type: string
          nullable: true
          description: Descripción resuelta mediante i18n y fallback.

    UserProduct:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: integer
          format: int64
          nullable: true
        basedOnBaseId:
          type: integer
          format: int64
          nullable: true
        defaultUnit:
          $ref: '#/components/schemas/UnitEnum'
        calories:
          type: integer
          format: int32
          nullable: true
        caloriesPer:
          $ref: '#/components/schemas/CaloriesPerEnum'
        shareWithListMembers:
          type: boolean
          default: false
        shareWithFriends:
          type: boolean
          default: false
        isActive:
          type: boolean

    BaseProductPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BaseProduct'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64

    UserProductPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserProduct'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64

    CreateBaseProductRequest:
      type: object
      required: [code, categoryId, defaultUnit, caloriesPer, isActive, translations]
      properties:
        code:
          type: string
          minLength: 1
        categoryId:
          type: integer
          format: int64
        defaultUnit:
          $ref: '#/components/schemas/UnitEnum'
        calories:
          type: integer
          format: int32
          nullable: true
        caloriesPer:
          $ref: '#/components/schemas/CaloriesPerEnum'
        isActive:
          type: boolean
        translations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductTranslation'

    UpdateBaseProductRequest:
      type: object
      properties:
        code:
          type: string
        categoryId:
          type: integer
          format: int64
        defaultUnit:
          $ref: '#/components/schemas/UnitEnum'
        calories:
          type: integer
          format: int32
          nullable: true
        caloriesPer:
          $ref: '#/components/schemas/CaloriesPerEnum'
        isActive:
          type: boolean
        translations:
          type: array
          description: Reemplaza el conjunto completo de traducciones.
          items:
            $ref: '#/components/schemas/ProductTranslation'

    CreateUserProductRequest:
      type: object
      required: [ownerId, name, defaultUnit, caloriesPer]
      properties:
        ownerId:
          type: string
          format: uuid
          description: >
            Placeholder sin autenticación real hasta Fase 4 (ver
            ADR-006-identificacion-propietario-sin-autenticacion).
        name:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: integer
          format: int64
          nullable: true
        defaultUnit:
          $ref: '#/components/schemas/UnitEnum'
        calories:
          type: integer
          format: int32
          nullable: true
        caloriesPer:
          $ref: '#/components/schemas/CaloriesPerEnum'
        shareWithListMembers:
          type: boolean
          default: false
        shareWithFriends:
          type: boolean
          default: false
        basedOnBaseId:
          type: integer
          format: int64
          nullable: true

    UpdateUserProductRequest:
      type: object
      required: [ownerId]
      properties:
        ownerId:
          type: string
          format: uuid
          description: Placeholder de ADR-006; se valida solo el formato.
        name:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: integer
          format: int64
          nullable: true
        defaultUnit:
          $ref: '#/components/schemas/UnitEnum'
        calories:
          type: integer
          format: int32
          nullable: true
        caloriesPer:
          $ref: '#/components/schemas/CaloriesPerEnum'
        shareWithListMembers:
          type: boolean
        shareWithFriends:
          type: boolean
        isActive:
          type: boolean

    ProductTranslation:
      type: object
      required: [locale, name]
      properties:
        locale:
          type: string
          minLength: 2
          maxLength: 5
        name:
          type: string
          maxLength: 128
        description:
          type: string
          nullable: true

    UnitEnum:
      type: string
      enum: [KG, G, L, ML, UNIT, DOZEN]

    CaloriesPerEnum:
      type: string
      enum: [G, ML, UNIT]

    ProductType:
      type: string
      enum: [BASE, USER]

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
          description: Mensaje localizado vía Spring MessageSource según Accept-Language.
