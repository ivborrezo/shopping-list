spring:
  datasource:
    url: jdbc:postgresql://${LIST_DB_HOST:localhost}:${LIST_DB_PORT_OUT:5435}/${LIST_DB_NAME:list_service_db}
    username: ${LIST_DB_USER:list_user}
    password: ${LIST_DB_PASSWORD:list_pass}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8083/realms/shopping-list}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8083/realms/shopping-list/protocol/openid-connect/certs}
