spring:
  application:
    name: list-service
  profiles:
    active: local
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: 8082

product-service:
  client:
    base-url: http://localhost:8081
    connect-timeout: 1s
    read-timeout: 2s
