openapi: 3.0.3
info:
  title: List Service API
  description: >
    API de gestión de listas de la compra y sus ítems para ShoppingList.


    Nota de vigencia: este documento es la fuente de verdad del contrato del
    servicio, redactado y mantenido a mano (Design-First). El código se
    implementa contra él; el contrato no se genera a partir del código.

    Alcance del borde: el contrato se sirve a través del API Gateway en la
    base URL pública. Un path no descrito en este documento responde 404
    generado por el borde, sin reenviar la petición a ningún servicio; ese
    caso no pertenece al enum de `code` (`ROUTE_NOT_FOUND` no forma parte del
    contrato de negocio). La cabecera `X-Correlation-Id` se ecoa en todas las
    respuestas; si la petición no la envía, el borde genera el identificador.
    Tras un 503, las operaciones no idempotentes (`POST`, `PATCH`, `DELETE`)
    no deben reintentarse a ciegas: el cliente comprueba el estado del
    recurso antes de repetir la operación. El borde limita el cuerpo de las
    peticiones a 1 MB y responde 413 cuando se supera; los cuerpos enviados
    sin `Content-Length` no se limitan en esta fase. Los rechazos del borde
    ajenos al contrato de error (403 de CORS y 431/413 de la capa HTTP) no
    incluyen cabeceras CORS.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Base URL pública (API Gateway)

tags:
  - name: lists
    description: Gestión de listas de la compra.
  - name: list-items
    description: Ítems dentro de una lista.

security:
  - bearerAuth: []

paths:
  /lists:
    parameters:
      - $ref: '#/components/parameters/XCorrelationId'
    get:
      tags: [lists]
      summary: Listar las listas del usuario autenticado
      description: >
        Devuelve las listas del usuario autenticado ordenadas por `updatedAt`
        descendente (las más recientes primero). El propietario se deriva del
        token `Bearer` JWT (ADR-019).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de listas del propietario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      tags: [lists]
      summary: Crear una lista
      description: >
        Crea una lista cuyo propietario es el usuario autenticado, derivado del
        token `Bearer` JWT (ADR-019). Publica el evento de dominio
        `list.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListRequest'
      responses:
        '201':
          description: Lista creada.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /lists/{id}:
    parameters:
      - $ref: '#/components/parameters/XCorrelationId'
    get:
      tags: [lists]
      summary: Obtener una lista por id
      description: >
        Solo el propietario autenticado puede consultarla. Si la lista no
        existe responde `404 LIST_NOT_FOUND`; si pertenece a otro usuario
        responde `403 OWNER_MISMATCH`. El propietario se deriva del token
        `Bearer` JWT (ADR-019).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista encontrada, con sus ítems.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    patch:
      tags: [lists]
      summary: Renombrar una lista
      description: >
        Edición parcial de la lista: actualiza `name` si se envía. Solo el
        propietario autenticado puede renombrarla: si la lista no existe
        responde `404 LIST_NOT_FOUND` y si pertenece a otro usuario responde
        `403 OWNER_MISMATCH`. Publica el evento de dominio `list.renamed`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListRequest'
      responses:
        '200':
          description: Lista actualizada, con sus ítems.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [lists]
      summary: Eliminar una lista
      description: >
        Solo el propietario autenticado puede eliminarla: si la lista no existe
        responde `404 LIST_NOT_FOUND` y si pertenece a otro usuario responde
        `403 OWNER_MISMATCH`. Publica el evento de dominio `list.deleted`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Lista eliminada.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /lists/{id}/items:
    parameters:
      - $ref: '#/components/parameters/XCorrelationId'
    post:
      tags: [list-items]
      summary: Añadir un producto a la lista
      description: >
        Añade un producto a una lista propia y guarda un snapshot
        (`displayName`) del nombre del producto en el momento de añadirlo
        (Snapshot pattern), resuelto contra product-service en el momento de la
        petición. El propietario se deriva del token `Bearer` JWT (ADR-019) y
        se propaga a product-service junto con `X-Correlation-Id` y
        `Accept-Language`. Si la lista no existe responde `404 LIST_NOT_FOUND`;
        si pertenece a otro usuario, `403 OWNER_MISMATCH`; si el producto
        referenciado no existe o pertenece a otro usuario, `400
        INVALID_PRODUCT_REFERENCE`. Publica el evento de dominio
        `list.item.added`.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddListItemRequest'
      responses:
        '201':
          description: Ítem añadido a la lista.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La lista ya contiene ese producto.
          headers:
            X-CorrelationId:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: >
            El producto no se pudo resolver: product-service no está disponible
            (`PRODUCT_SERVICE_UNAVAILABLE`) o el borde no pudo completar la
            petición (`SERVICE_UNAVAILABLE`).
          headers:
            X-CorrelationId:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          $ref: '#/components/responses/RateLimited'

  /lists/{id}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/XCorrelationId'
    delete:
      tags: [list-items]
      summary: Eliminar un producto de la lista
      description: >
        Elimina un ítem de una lista propia. Si la lista no existe responde
        `404 LIST_NOT_FOUND`; si pertenece a otro usuario, `403 OWNER_MISMATCH`;
        si el ítem no existe o no pertenece a la lista, `404
        LIST_ITEM_NOT_FOUND`. Publica el evento de dominio `list.item.removed`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Ítem eliminado.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    patch:
      tags: [list-items]
      summary: Marcar un ítem como comprado o pendiente
      description: >
        Marca o desmarca como comprado un ítem de una lista propia. Si la lista
        no existe responde `404 LIST_NOT_FOUND`; si pertenece a otro usuario,
        `403 OWNER_MISMATCH`; si el ítem no existe o no pertenece a la lista,
        `404 LIST_ITEM_NOT_FOUND`. Publica el evento de dominio
        `list.item.purchased`, con el campo `purchased` reflejando el nuevo
        estado (cubre tanto marcar como desmarcar).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListItemPurchasedRequest'
      responses:
        '200':
          description: Ítem actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT de acceso emitido por el proveedor OIDC. El servicio valida
        firma, expiración, emisor y el claim de identificador de usuario
        (UUID) antes de atender la petición.

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >
        Idioma solicitado para resolver el nombre del producto (snapshot) contra
        product-service (es | en | eu). Se reenvía tal cual; si no se especifica
        o el idioma no tiene traducción, product-service aplica su fallback a `en`.
      schema:
        type: string
        enum: [es, en, eu]
        default: en
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Identificador de correlación de la petición. Si no se envía, el borde
        genera uno; el valor recibido o generado se ecoa en la respuesta.
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: >
        Credenciales ausentes o inválidas: no se ha enviado la cabecera
        `Authorization: Bearer`, el token está expirado o malformado, su firma
        no es válida, el emisor no está reconocido o el claim de identificador
        de usuario no es un UUID válido.
      headers:
        X-CorrelationId:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: El recurso solicitado no existe.
      headers:
        X-CorrelationId:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: >
        Error de validación de la petición. La validación Bean Validation y los
        errores de parámetros de petición (valor no convertible, parámetro
        obligatorio ausente, constraints de parámetro) responden con code
        VALIDATION_FAILED y el array errors; un body no procesable responde
        VALIDATION_FAILED sin errors. Los errores de negocio 400 (referencia de
        producto inválida o inexistente, tipo de producto no soportado, etc.)
        usan el shape ProblemDetail sin errors.
      headers:
        X-CorrelationId:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'
    Forbidden:
      description: >
        El usuario autenticado no tiene permiso para ejecutar la operación: la
        lista o el ítem referenciado pertenece a otro propietario (`code:
        OWNER_MISMATCH`). El propietario se deriva del token `Bearer` JWT
        (ADR-019).
      headers:
        X-CorrelationId:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    RateLimited:
      description: >
        Se ha superado el límite de peticiones del borde.
      headers:
        X-CorrelationId:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    ServiceUnavailable:
      description: >
        Un servicio de destino no está disponible para completar la petición.
      headers:
        X-CorrelationId:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  headers:
    XCorrelationId:
      description: >
        Identificador de correlación de la petición, ecoado por el servicio y
        por el borde.
      schema:
        type: string
        format: uuid

  schemas:
    ShoppingList:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre de la lista (texto libre).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/ListItem'

    ShoppingListSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre de la lista (texto libre).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ListPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingListSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64

    CreateListRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128

    UpdateListRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          maxLength: 128

    ListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productType:
          type: string
          enum: [BASE, USER]
        displayName:
          type: string
          description: >
            Snapshot del nombre del producto en el momento de añadirlo a la
            lista (Snapshot pattern); no se actualiza si el catálogo cambia
            después.
        purchased:
          type: boolean
          default: false

    AddListItemRequest:
      type: object
      required: [productId, productType]
      properties:
        productId:
          type: string
          format: uuid
        productType:
          type: string
          enum: [BASE, USER]

    UpdateListItemPurchasedRequest:
      type: object
      required: [purchased]
      properties:
        purchased:
          type: boolean

    ProblemDetail:
      type: object
      description: >
        Respuesta de error según RFC 9457 (application/problem+json) con la
        extensión code del contrato. El catálogo completo de códigos vive en
        el enum ErrorCode (ver ADR-014); las excepciones no controladas
        responden 500 con code INTERNAL_ERROR, fuera del catálogo.
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
          description: Resumen estable del error en inglés, el mismo para todas las ocurrencias.
        status:
          type: integer
          format: int32
        detail:
          type: string
          description: Mensaje específico en inglés; puede incluir el identificador del recurso implicado.
        instance:
          type: string
          format: uri
          nullable: true
          description: URI del recurso de la petición que produjo el error.
        code:
          type: string
          enum: [LIST_NOT_FOUND, LIST_ITEM_NOT_FOUND, OWNER_MISMATCH, DUPLICATE_LIST_ITEM, INVALID_PRODUCT_REFERENCE, PRODUCT_SERVICE_UNAVAILABLE, INVALID_PRODUCT_TYPE, UNAUTHENTICATED, ACCESS_DENIED, RATE_LIMIT_EXCEEDED, SERVICE_UNAVAILABLE, VALIDATION_FAILED]
          description: Identificador machine-readable del error; el contrato entre el backend y el frontend.

    FieldError:
      type: object
      description: Error de validación de un campo concreto de la petición.
      properties:
        code:
          type: string
          description: Nombre de la constraint que falla (FieldError.getCode(), p.ej. NotBlank).
        field:
          type: string
          description: Nombre del campo que falla.
        message:
          type: string
          description: Mensaje de la constraint en inglés (FieldError.getDefaultMessage()).

    ValidationProblemDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            errors:
              type: array
              description: >
                Errores por campo; presente en la validación Bean Validation y en
                los errores de parámetros de petición. Un body no procesable
                responde VALIDATION_FAILED sin errors.
              items:
                $ref: '#/components/schemas/FieldError'
