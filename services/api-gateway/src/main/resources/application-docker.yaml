spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8083/realms/shopping-list}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://auth-service:8080/realms/shopping-list/protocol/openid-connect/certs}
      client:
        provider:
          keycloak:
            authorization-uri: ${OIDC_AUTH_URI:http://localhost:8083/realms/shopping-list/protocol/openid-connect/auth}
            token-uri: ${OIDC_TOKEN_URI:http://auth-service:8080/realms/shopping-list/protocol/openid-connect/token}
            jwk-set-uri: ${OIDC_JWK_SET_URI:http://auth-service:8080/realms/shopping-list/protocol/openid-connect/certs}
            user-info-uri: ${OIDC_USER_INFO_URI:http://auth-service:8080/realms/shopping-list/protocol/openid-connect/userinfo}

product-service:
  client:
    base-url: http://product-service:8081

list-service:
  client:
    base-url: http://list-service:8082

api-gateway:
  rate-limit:
    requests: 120
  security:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8083/realms/shopping-list}
