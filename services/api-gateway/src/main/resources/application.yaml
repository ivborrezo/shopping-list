spring:
  application:
    name: api-gateway
  profiles:
    active: local
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 5s
          routes:
            - id: product-service
              uri: ${product-service.client.base-url}
              predicates:
                - Path=/categories/**,/base-products/**,/user-products/**
            - id: list-service
              uri: ${list-service.client.base-url}
              predicates:
                - Path=/lists/**

server:
  port: 8080
  max-http-request-header-size: 16KB

gateway:
  max-body-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

product-service:
  client:
    base-url: http://localhost:8081

list-service:
  client:
    base-url: http://localhost:8082
