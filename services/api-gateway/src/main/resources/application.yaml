spring:
  application:
    name: api-gateway
  profiles:
    active: local
  reactor:
    context-propagation: auto
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:gateway-client}
            client-secret: ${OIDC_CLIENT_SECRET:gateway-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            user-name-attribute: sub
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:5173
                  - http://localhost:4173
                allowed-methods:
                  - GET
                  - POST
                  - PATCH
                  - DELETE
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - Accept-Language
                  - X-Correlation-Id
                  - X-XSRF-TOKEN
                exposed-headers:
                  - X-Correlation-Id
                max-age: 1800
                allow-credentials: true
          default-filters:
            - TokenRelay=
          httpclient:
            connect-timeout: 1000
            response-timeout: 5s
          routes:
            - id: product-service
              uri: ${product-service.client.base-url}
              predicates:
                - Path=/categories/**,/base-products/**,/user-products/**
            - id: list-service
              uri: ${list-service.client.base-url}
              predicates:
                - Path=/lists/**

server:
  port: 8080
  max-http-request-header-size: 16KB
  forward-headers-strategy: none

api-gateway:
  max-body-size: 1MB
  rate-limit:
    requests: 600
    window: 60s
  security:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8083/realms/shopping-list}
    principal-claim: ${SECURITY_JWT_PRINCIPAL_CLAIM:sub}
    roles-claim: ${SECURITY_JWT_ROLES_CLAIM:roles}
    session-ttl: 30m
    max-sessions: 10000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

product-service:
  client:
    base-url: http://localhost:8081

list-service:
  client:
    base-url: http://localhost:8082
