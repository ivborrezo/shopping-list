spring:
  application:
    name: api-gateway
  profiles:
    active: local
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:5173
                  - http://localhost:4173
                allowed-methods:
                  - GET
                  - POST
                  - PATCH
                  - DELETE
                allowed-headers:
                  - Content-Type
                  - Accept-Language
                  - X-Correlation-Id
                exposed-headers:
                  - X-Correlation-Id
                max-age: 1800
                allow-credentials: false
          httpclient:
            connect-timeout: 1000
            response-timeout: 5s
          routes:
            - id: product-service
              uri: ${product-service.client.base-url}
              predicates:
                - Path=/categories/**,/base-products/**,/user-products/**
            - id: list-service
              uri: ${list-service.client.base-url}
              predicates:
                - Path=/lists/**

server:
  port: 8080
  max-http-request-header-size: 16KB
  forward-headers-strategy: none

api-gateway:
  max-body-size: 1MB
  rate-limit:
    requests: 600
    window: 60s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

product-service:
  client:
    base-url: http://localhost:8081

list-service:
  client:
    base-url: http://localhost:8082
