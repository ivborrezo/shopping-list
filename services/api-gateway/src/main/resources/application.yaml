spring:
  application:
    name: api-gateway
  profiles:
    active: local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

product-service:
  client:
    base-url: http://localhost:8081

list-service:
  client:
    base-url: http://localhost:8082
