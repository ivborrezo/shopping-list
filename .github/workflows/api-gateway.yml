name: api-gateway CI

# Trigger policy (ADR-009, Decisión 4):
#   - paths del servicio afectado
#   - config/checkstyle/** (ruleset compartido; un cambio puede romper
#     cualquier servicio que lo use)
#   - docs/cicd/** (documentación operativa del pipeline)
#   - services/*/docs/api-contract.yaml (el gateway cubre y valida los
#     contratos de los servicios de destino)
#   - scripts/** (verificación del despliegue compuesto)
#   - el propio workflow (self-validation: un typo en el YAML se
#     descubre al re-ejecutarse)
on:
  push:
    paths:
      - services/api-gateway/**
      - config/checkstyle/**
      - docs/cicd/**
      - services/*/docs/api-contract.yaml
      - scripts/**
      - .github/workflows/api-gateway.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Verificación de sintaxis del script operativo antes de arrancar
      # las toolchains; el script no se ejecuta en CI.
      - name: Shell syntax (verify-compose.sh)
        run: bash -n scripts/verify-compose.sh

      # Caching Maven vía setup-java (ADR-009, Decisión 7): invalidación
      # por hash del pom.xml, salta el download de dependencias desde
      # Maven Central en cada run.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Orden fail-fast (ADR-009 §4 / cicd-strategy.md §4): lo barato
      # antes que lo caro. Cada step es bloqueante.
      - name: Spotless check
        run: ./services/api-gateway/mvnw -f services/api-gateway/pom.xml spotless:check

      - name: Checkstyle check
        run: ./services/api-gateway/mvnw -f services/api-gateway/pom.xml checkstyle:check

      - name: Compile
        run: ./services/api-gateway/mvnw -f services/api-gateway/pom.xml -q compile

      # Verify con WireMock (ADR-008/ADR-009 Decisión 6): no hay
      # infraestructura de persistencia en el borde, así que los IT
      # usan WireMock y WebTestClient.
      - name: Verify
        run: ./services/api-gateway/mvnw -f services/api-gateway/pom.xml clean verify

      # Caching BuildKit (ADR-009, Decisión 7): reutiliza las capas
      # del stage builder entre runs vía el backend de GitHub Actions
      # cache. El # syntax=docker/dockerfile:1.4 del Dockerfile ya
      # habilita BuildKit.
      - uses: docker/setup-buildx-action@v4

      - name: Docker build (valida Dockerfile)
        uses: docker/build-push-action@v7
        with:
          context: services/api-gateway/
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
